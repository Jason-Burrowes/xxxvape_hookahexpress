<div class="services-container">
  <div class="services-header">
    <h1>Hookah Express Services</h1>
    <p>Professional hookah services tailored to your needs</p>
  </div>

  <div class="services-grid">
    <div class="service-card" *ngFor="let service of services">
      <div class="service-icon">{{ service.icon }}</div>
      <div class="service-info">
        <h3>{{ service.name }}</h3>
        <p class="service-description">{{ service.description }}</p>
        <ul class="service-features">
          <li *ngFor="let feature of service.features">{{ feature }}</li>
        </ul>
        <div class="service-footer">
          <span class="service-price">
            <span class="price-label">Starting at</span>
            ${{ service.price.toFixed(2) }}
          </span>
          <button class="btn-book-service">Book Now</button>
        </div>
      </div>
    </div>
  </div>

  <div class="contact-section">
    <h2>Need a Custom Service?</h2>
    <p>Contact us to discuss your specific requirements</p>
    <button class="btn-contact">Contact Us</button>
  </div>
</div>
