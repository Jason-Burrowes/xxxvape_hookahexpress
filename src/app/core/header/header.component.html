<header [class]="'header ' + (selectedBrand || 'default')">
  <div class="header-container">
    <div class="logo">
      <a routerLink="/landing">
        <img
          *ngIf="selectedBrand === 'xxxvape'"
          class="brand-logo"
          src="assets/Logo/White-1-1.png"
          alt="XXXVape Hookah Express Logo"
        />
        <span *ngIf="selectedBrand === 'xxxvape'" class="brand-name"
          >XXX Vape</span
        >
        <span *ngIf="selectedBrand === 'hookahexpress'" class="brand-name"
          >Hookah Express</span
        >
        <span *ngIf="!selectedBrand" class="brand-name"
          >XXX Vape & Hookah Express</span
        >
      </a>
    </div>

    <nav class="navigation">
      <a
        routerLink="/landing"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Home</a
      >

      <div
        class="dropdown"
        *ngIf="selectedBrand === 'xxxvape' || !selectedBrand"
      >
        <a class="dropbtn">XXX Vape</a>
        <div class="dropdown-content">
          <a routerLink="/xxxvape/products">Products</a>
        </div>
      </div>

      <div
        class="dropdown"
        *ngIf="selectedBrand === 'xxxvape' || !selectedBrand"
      >
        <a class="dropbtn">Retailer</a>
        <div class="dropdown-content">
          <a routerLink="/retailer/become">Become a Retailer</a>
          <a routerLink="/retailer/locations">Find Retail Locations</a>
        </div>
      </div>

      <div
        class="dropdown"
        *ngIf="selectedBrand === 'hookahexpress' || !selectedBrand"
      >
        <a class="dropbtn">Hookah Express</a>
        <div class="dropdown-content">
          <a routerLink="/hookahexpress/products">Products</a>
          <a routerLink="/hookahexpress/services">Services</a>
        </div>
      </div>
    </nav>

    <div class="user-menu">
      <div *ngIf="!isLoggedIn">
        <button class="btn-login" (click)="openLoginModal()">Login</button>
      </div>
      <div *ngIf="isLoggedIn" class="user-info">
        <span class="username">{{ currentUser }}</span>
        <button class="btn-logout" (click)="logout()">Logout</button>
      </div>
    </div>
  </div>

  <!-- Login Modal -->
  <div class="modal" *ngIf="showLoginModal" (click)="closeLoginModal()">
    <div class="modal-content" (click)="$event.stopPropagation()">
      <span class="close" (click)="closeLoginModal()">&times;</span>
      <h2>Login</h2>
      <form (ngSubmit)="login()">
        <div class="form-group">
          <label for="username">Username:</label>
          <input
            type="text"
            id="username"
            [(ngModel)]="username"
            name="username"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Password:</label>
          <input
            type="password"
            id="password"
            [(ngModel)]="password"
            name="password"
            required
          />
        </div>
        <button type="submit" class="btn-submit">Login</button>
      </form>
    </div>
  </div>
</header>
